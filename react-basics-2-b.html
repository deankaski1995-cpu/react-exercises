<!DOCTYPE html>
<html lang="en">
<head>
  <title>React basic exercise 2-b</title>
</head>
<body>
  <div class="js-container"></div>

  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

  <script src="https://unpkg.com/supersimpledev/babel.js"></script>
  <script type="text/babel">
    function Socks(){
      return (
        <>
          <p>Cotton socks</p>
          <p>Price: $10.90</p>
          <button>Add to Cart</button>
        </>
      )
    }

    function ProductDetails({name, price, discountPrice, imageSrc}){
      return (
        <div style= {{maxWidth: '100px'}}>
          <img src={imageSrc} style={{ maxWidth: '100%' }} />
          
          <p>{name}</p>
          {!discountPrice ? <p>Price ${price}</p> : <del><p>Price ${price}</p></del>}
          {discountPrice && (<p>Discount price: {discountPrice}</p>)}
          <button>Add to Cart</button>
        </div>
      )
    }

    function App() {
      return (
        <>
          <ProductDetails
            imageSrc="/images/cotton-socks.png"
            name="Cotton socks"
            price="6.00"
            discountPrice="5.45"
          />
          <ProductDetails
            imageSrc="/images/tennis-balls.png"
            name="Tennis balls"
            price="6.00"
          />
          <ProductDetails
            imageSrc="/images/plain-t-shirt.png"
            name="Plain T-Shirt"
            price="7.99"
          />
        </>
      )
    }

    const container = document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(<App />);
  </script>
</body>
</html>
